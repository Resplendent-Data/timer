name: 'Release'

on:
  push:
    branches:
      - master

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Resplendent Timer v__VERSION__'
          releaseBody: |
            ## Downloads

            Download the appropriate installer for your platform:

            - **macOS (Apple Silicon)**: `.dmg` file
            - **Linux**: `.AppImage` or `.deb` file

            ---

            ## macOS Installation

            1. Download the `.dmg` file
            2. Open the DMG and drag the app to Applications
            3. **Important:** Before opening, run this command in Terminal:

            ```bash
            xattr -cr "/Applications/Resplendent Timer.app"
            ```

            4. Now open the app normally

            > **Why?** The app is not signed with an Apple Developer certificate, so macOS marks it as "damaged". The command above removes this quarantine flag.

            ---

            ## Linux Installation

            ### AppImage
            ```bash
            chmod +x Resplendent_Timer_*.AppImage
            ./Resplendent_Timer_*.AppImage
            ```

            ### Debian/Ubuntu
            ```bash
            sudo dpkg -i resplendent-timer_*.deb
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
